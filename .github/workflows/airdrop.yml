name: airdrop-radar

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: airdrop-radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install
        run: pip install "requests>=2.31,<3"

      - name: monitor
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          TZ: Asia/Shanghai
        run: python airdrop_monitor.py

      - name: report
        env:
          TZ: Asia/Shanghai
        run: |
          python daily_report.py
          cp report.html index.html

      - name: save
        run: |
          git config user.name "airdrop-bot"
          git config user.email "bot@users.noreply.github.com"
          git add report.html index.html report.md seen.json
          git diff --cached --quiet || git commit -m "update"
          git push
